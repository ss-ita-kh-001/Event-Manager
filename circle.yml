dependencies:
  post:
    - wget https://selenium-release.storage.googleapis.com/2.44/selenium-server-standalone-2.44.0.jar
    - java -jar selenium-server-standalone-2.44.0.jar:
        background: true  post:
    - node ./package.json
database:
  override:
    - psql -U ubuntu circle_test < ./db_scripts/setup_db.sql
test:
  override:
    - npm test
    - protractor protractor_conf.js
deployment:
  prod:
    branch: master
    heroku:
      appname: ita-event-manager
  dev:
     branch: dev
     heroku:
       appname: dev-ita-event-manager