machine:
  environment:
    EM_PG_CONN: postgres://ubuntu@127.0.0.1:5432/circle_test
#    SELENIUM_PORT: 4444
#    BS_AUTOMATE_PROJECT: "Run on circleCI"
#    BS_AUTOMATE_BUILD: "build No. $CIRCLE_BUILD_NUM for circleCI"
#    SELENIUM_PLATFORM: WINDOWS
#    SELENIUM_BROWSER: chrome
dependencies:
  pre:
    - npm install
    - npm start &
    - node ./package.json
    - node ./node_modules/protractor/node_modules/webdriver-manager/bin/webdriver-manager update
    - node ./node_modules/protractor/node_modules/webdriver-manager/bin/webdriver-manager start
database:
  override:
    - psql -U ubuntu circle_test < ./db_scripts/setup_db.sql
test:
  override:
    - npm test
    - protractor protractor_conf.js --troubleshoot
deployment:
  prod:
    branch: master
    heroku:
      appname: ita-event-manager
  dev:
     branch: dev
     heroku:
       appname: dev-ita-event-manager
  protractor:
     branch: protractor-tests
     heroku:
       appname: protractor-testing
